name: CI/CD

# Pull requests are built and tested on GitHub-hosted runners only. Production is deployed from
# main by a self-hosted runner on the production host, behind the "production" environment's
# required reviewers. This repository is public, so nothing triggered by a pull request may ever
# reach the self-hosted runner: the deploy job is gated on the event and the branch below, and
# the environment is restricted to main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy instead of building (e.g. sha-<commit>), for rollback. Leave empty to build and deploy main."
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/howto-software/howtoosoftware-hosting-prototype
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HowToSoftware.Hosting.slnx

      # Release treats warnings as errors (Directory.Build.props).
      - name: Build
        run: dotnet build HowToSoftware.Hosting.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test HowToSoftware.Hosting.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  image:
    name: Container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      # Pull requests build the image to prove the Dockerfile still works, but never push it.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: [test, image]
    # Never for pull requests, and only from main. always() lets a rollback dispatch run
    # while test/image are skipped; a failed or cancelled build still blocks the deploy.
    if: >-
      always() && !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (needs.image.result == 'success'
          || (github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
              && needs.test.result == 'skipped' && needs.image.result == 'skipped'))
    runs-on: [self-hosted, linux, hts-production]
    timeout-minutes: 20
    environment:
      name: production
      url: https://host.howto.software
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          HTS_IMAGE: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag || needs.image.outputs.tag }}
        run: bash deploy/deploy.sh
