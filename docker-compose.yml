name: hts-hosting-prototype

services:
  site:
    container_name: hts-hosting-site
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5147:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      APP_ALLOWED_HOSTS: "localhost;127.0.0.1;[::1];192.168.1.206;howtoosoftware.com;www.howtoosoftware.com"
      SQLSERVER_CONNECTION_STRING: "${SQLSERVER_CONNECTION_STRING}"
